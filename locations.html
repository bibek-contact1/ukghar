<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universities &amp; locations | UKGhar</title>
  <meta name="description" content="Find UKGhar student rooms near University of East London, BPP, Coventry University London, University of West London, Roehampton and York St John London.">
  <meta name="theme-color" content="#13204a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="locations">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <ol class="breadcrumbs"><li><a href="index.html">Home</a></li><li aria-current="page">Universities</li></ol>
        <p class="eyebrow">Universities &amp; locations</p>
        <h1>Find your room near campus</h1>
        <p class="lead">Filter by university, location, sharing and budget. Every price includes bills.</p>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <form class="filters" id="loc-filters" role="search" aria-label="Filter rooms">
          <div class="field">
            <label for="loc-q" class="visually-hidden">Search universities, areas, stations or properties</label>
            <div class="search-input">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input class="input" id="loc-q" type="search" placeholder="Search a university, area, station or property">
            </div>
          </div>
          <div class="filters-grid">
            <div class="field">
              <label for="loc-uni">University</label>
              <select class="select" id="loc-uni"></select>
            </div>
            <div class="field">
              <label for="loc-area">Preferred location</label>
              <select class="select" id="loc-area"></select>
            </div>
            <div class="field">
              <label for="loc-sharing">Sharing</label>
              <select class="select" id="loc-sharing"></select>
            </div>
            <div class="field">
              <label for="loc-min">Min price <span class="muted">/ month</span></label>
              <select class="select" id="loc-min"></select>
            </div>
            <div class="field">
              <label for="loc-max">Max price <span class="muted">/ month</span></label>
              <select class="select" id="loc-max"></select>
            </div>
          </div>
        </form>

        <div class="results-bar">
          <p id="loc-count" aria-live="polite"></p>
          <button class="btn btn-ghost btn-sm" type="button" id="loc-clear" data-reset hidden>Clear all filters</button>
        </div>

        <div class="loc-list" id="loc-list"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
