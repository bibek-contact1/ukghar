<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | UKGhar</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#13204a">
  <!-- Self-contained on purpose: this page can be shown from any URL, so relative paths can't be trusted. -->
  <style>
    :root { --brand: #d6343f; --brand-dark: #b0252f; --navy: #13204a; --muted: #5a6178; --bg: #fbf8f3; --line: #e4e1da; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: #1b2033; line-height: 1.6; text-align: center; }
    .box { max-width: 520px; }
    .logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--navy); font-size: 1.5rem; font-weight: 600; margin-bottom: 32px; }
    .logo b { font-weight: 800; color: var(--brand); }
    .logo svg { width: 40px; height: 40px; }
    .code { font-size: 5rem; font-weight: 800; color: var(--brand); line-height: 1; margin: 0; letter-spacing: -.04em; }
    h1 { color: var(--navy); font-size: 1.8rem; margin: 12px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 14px 24px; border-radius: 999px; font-weight: 700; text-decoration: none; margin: 4px; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-outline { border: 2px solid var(--navy); color: var(--navy); }
    .btn-outline:hover { background: var(--navy); color: #fff; }
    .links { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); font-size: .95rem; }
    .links a { color: var(--brand-dark); margin: 0 8px; }
  </style>
</head>
<body>
  <div class="box">
    <a class="logo" href="./" data-home><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#d6343f"/><path d="M10 19.5 20 11l10 8.5V29a1.5 1.5 0 0 1-1.5 1.5H11.5A1.5 1.5 0 0 1 10 29z" fill="#fff"/><path d="M20 27.5s-4.5-2.7-4.5-5.6a2.3 2.3 0 0 1 4.5-.8 2.3 2.3 0 0 1 4.5.8c0 2.9-4.5 5.6-4.5 5.6z" fill="#d6343f"/></svg><span>UK<b>Ghar</b></span></a>
    <p class="code">404</p>
    <h1>We couldn't find that page</h1>
    <p>The link may be old or mistyped. The rooms are still here though.</p>
    <a class="btn btn-primary" href="./" data-home>Back to home</a>
    <a class="btn btn-outline" href="facilities.html" data-page>See our rooms</a>
    <div class="links">
      <a href="locations.html" data-page>Universities</a>
      <a href="community.html" data-page>Student life</a>
      <a href="contact.html" data-page>Contact</a>
    </div>
  </div>
  <script>
    // Work out where the site lives: "/ukghar/" on GitHub Pages, "/" on a custom domain.
    (function () {
      var seg = location.pathname.split("/")[1];
      var base = /github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
      document.querySelectorAll("[data-home]").forEach(function (a) { a.href = base; });
      document.querySelectorAll("[data-page]").forEach(function (a) { a.href = base + a.getAttribute("href"); });
    })();
  </script>
</body>
</html>
